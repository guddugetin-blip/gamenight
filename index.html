<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wits &amp; Winks · Game Night Sign-up</title>
<style>
:root{--bg:#f6f4fc;--card:#fff;--tx:#1e1b2e;--mu:#6b6880;--ac:#4f46e5;--ac2:#eceafd;--bd:#e5e3f2;color-scheme:light only;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;padding:22px 18px 28px;border-radius:0 0 28px 28px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
header h1{margin:0;font-size:24px}header p{margin:6px 0 0;opacity:.9;font-size:14px}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:24px 0 8px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(60,50,120,.08)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
button.ghost{background:var(--ac2);color:var(--ac)}button.red{background:none;color:#ef4444;padding:6px 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.feel{display:flex;gap:6px}.fb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;background:var(--ac2);color:var(--tx);border:2px solid transparent;font-weight:500}
.fb span{font-size:20px}.fb.on{border-color:var(--ac);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 14px;border-radius:99px;background:#fff;border:2px solid var(--bd);color:var(--tx);font-weight:500;font-size:14px}
.chip.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.go{width:100%;font-size:17px;padding:16px;margin-top:20px}
.wa{display:block;text-align:center;text-decoration:none;background:#22c55e;color:#fff;font-weight:700;border-radius:14px;padding:16px;font-size:17px;margin-top:14px}
.err{color:#ef4444;font-size:14px;margin-top:10px;text-align:center}
.mu{color:var(--mu);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.4 system-ui,sans-serif;background:var(--ac2);border-radius:12px;padding:12px;max-height:220px;overflow:auto}
.sg{position:absolute;left:0;right:0;z-index:5;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 18px rgba(60,50,120,.15);overflow:hidden;margin-top:4px}.sg:empty{display:none}.sg button{display:block;width:100%;text-align:left;background:#fff;color:var(--tx);border-radius:0;font-weight:500;padding:12px 14px;border-bottom:1px solid var(--bd)}
.opt2{display:block;width:100%;text-align:left;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:6px 0;font-weight:500}.opt2.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}.opt2.add{border-style:dashed;color:var(--ac)}
.list.big{max-height:300px;overflow:auto;padding-right:2px}details summary{cursor:pointer;font-weight:600}details p{margin:6px 0;font-size:14px}
.cnt{background:var(--ac);color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;margin-left:6px;text-transform:none;letter-spacing:0}
.x{background:none;color:var(--mu);padding:4px 10px;font-size:18px}
</style>
</head>
<body>
<header><div class="brand">Wits &amp; Winks Tabletop</div><h1>🎲 Game Night Sign-up</h1><p>Tell us which games you love and how well you play them. We’ll match you with the right table and the right partners.</p></header>
<main id="app"></main>
<script>
var GAMES=["5-Minute Dungeon", "800 Pound Gorilla", "Akropolis", "Avocado Smash", "Azul", "Azul - Master Chocolatier", "Azul - Summer Pavilion", "Azul Duel", "Buffet Boss", "Bunny 100", "Burger ASAP", "Burst", "Cahoots", "Calico", "Carcassonne", "Cascadia", "Castle Combo", "Catan", "Century: Spice Road", "Check Out", "Clans of Caledonia", "Codenames", "Concordia", "Costume Party Detective", "Cuff the Bluff", "Cupcake Academy", "Danger Danger", "Dawn Under", "Dobble / Spot It", "Dominion", "Don’t LLAMA", "Draftosaurus", "Duck and Cover", "Exploding Kittens", "Finca", "Fit to Print", "Five Crowns", "Flip 7", "Flip 7 with a Vengeance", "Food Fight", "Go Go Gelato", "Grand Austria Hotel", "Halli Galli", "Happy Dim Sum", "Happy Mochi", "Happy Salmon", "Harmonies", "In Front of the Elevator", "Jungle Speed", "King of Tokyo", "Kingdomino", "Labyrinth", "Lego Brick Like This", "Lego Monkey Palace", "Legs Crossed", "Linko", "Love Letter", "Mantis", "Moo’s Code", "Museum Suspect", "Nayakas", "No Thanks!", "None of a Kind", "OrganATTACK", "Pandemic", "Peach Snaps", "Peranakan", "Pick a Dog/ Pig/ Seal/ Polar Bear", "Piles", "Point Salad", "Quarto", "Quiddler", "Qwirkle", "Qwirkle Cubes", "Qwirkle Rummy", "Rebel Princess", "Ringer", "Rummikub", "Saboteur", "Scholars of the South Tigris", "Sea Salt & Paper", "Sequence", "SET", "Shifting Stones", "Sleeping Queens", "Splendor", "Splendor Marvel", "Stabbits", "Starry Night Sky", "Survive the Island", "Sushi Go", "Ta-Da!", "Taco Cat Goat Cheese Pizza", "TACTA", "Take 5", "Tapple", "Terraforming Mars", "That’s Not a Hat", "The Durian Game", "Ticket to Ride", "Tiki Topple", "Trio", "Truffle Shuffle", "Ubongo", "Uninvited Guests at a Wedding", "Viticulture", "Viticulture Tuscany", "Wayfarers of the South Tigris", "Who Did It?", "Wingspan", "Word A Round", "Zoople"];
var WA="6580153904";/* WhatsApp number with country code, digits only */
var RT=["New to it","Learning","Can play","Comfortable","Strong","Expert"];
var RD=["Never played, or want to try","Played a few times","Know the basics","Know the rules, play smoothly","Play confidently","Could teach it to others"];
var FE=[[2,"❤️","Love it"],[1,"👍","Like it"],[0,"😐","It’s okay"],[-1,"👎","Not a fan"],[-2,"😡","Hate it"]];
var STYLE=["Competitive","Casual and chilled","Team games","2-player games","Big groups","Quick games (under 30 min)","Long strategy games","Happy to teach beginners","Still a beginner"];
var WHEN=["Weekday evenings","Weekends","Daytime"];
var D={n:"",p:"",e:"",a:"",c:"",pf:[],w:[],g:[]},done=null,Q="",BR=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function init(){
done=null;
$("app").innerHTML='<div class="card" style="background:var(--ac2);border:0"><b>How it works</b><ol style="margin:8px 0 0;padding-left:20px;line-height:1.6"><li>Add your name and phone number.</li><li>Tap all the games you play. You can pick as many as you like.</li><li>Choose how well you play each one and how you feel about it.</li><li>Tap <b>Send on WhatsApp</b> and press send.</li></ol></div>'+
'<h2>1 · About you</h2><div class="card"><label>Your name *</label><input value="'+esc(D.n)+'" oninput="D.n=this.value" autocomplete="name">'+
'<label>Phone number * <span class="mu">(use the same number every time)</span></label><input type="tel" value="'+esc(D.p)+'" oninput="D.p=this.value" autocomplete="tel">'+
'<label>Email</label><input type="email" value="'+esc(D.e)+'" oninput="D.e=this.value" autocomplete="email" placeholder="you@example.com">'+
'<label>Address or area</label><input value="'+esc(D.a)+'" oninput="D.a=this.value" autocomplete="street-address" placeholder="e.g. Kothrud, Pune"></div>'+
'<h2>2 · Pick your games</h2><p class="mu" style="margin:0 0 8px">Search by typing 2 letters, then tap each game you play. Tap again to remove it.</p>'+
'<input id="q" autocomplete="off" placeholder="Search '+GAMES.length+' games…" value="'+esc(Q)+'" oninput="Q=this.value;res()"><div id="res"></div>'+
'<button class="ghost" id="bb" style="width:100%;margin-top:8px" onclick="BR=!BR;res()"></button>'+
'<h2>3 · Rate your games <span class="cnt" id="cnt">0</span></h2>'+
'<details class="card"><summary>What do the levels mean?</summary>'+RT.map(function(t,k){return'<p><b>'+t+'</b> · '+RD[k]+'</p>'}).join("")+'</details><div id="bulk"></div><div id="mine"></div>'+
'<h2>4 · How you like to play <span class="mu" style="text-transform:none;letter-spacing:0">(optional)</span></h2><div class="chips" id="chs"></div>'+
'<h2>5 · Anything else? <span class="mu" style="text-transform:none;letter-spacing:0">(optional)</span></h2><textarea rows="3" oninput="D.c=this.value" placeholder="Allergies, favourite snacks, people you’d like to play with…">'+esc(D.c)+'</textarea>'+
'<div id="err"></div><button class="go" onclick="send()">Continue</button><p class="mu" style="text-align:center;margin-top:14px">Your details are only used by Wits &amp; Winks to match you with games and partners.</p>';
res();mine();chips();window.scrollTo(0,0)}
function has(n){return D.g.findIndex(function(g){return nm(g.n)===nm(n)})}
function res(){
var q=Q.trim().toLowerCase(),l=[],h="";
if(BR)l=GAMES.map(function(g,i){return i});
else if(q.length>=2){var a=[],b=[];GAMES.forEach(function(g,i){var s=g.toLowerCase(),k=s.indexOf(q);if(k===0)a.push(i);else if(k>0)b.push(i)});l=a.concat(b).slice(0,12)}
h=l.map(function(i){var on=has(GAMES[i])>-1;return'<button class="opt2'+(on?" on":"")+'" onclick="tgl('+i+')">'+(on?"✓ ":"+ ")+esc(GAMES[i])+'</button>'}).join("");
if(!BR&&q.length>=2&&!GAMES.some(function(g){return nm(g)===nm(Q)}))h+='<button class="opt2 add" onclick="own()">+ Add “'+esc(Q.trim())+'” as my own game</button>';
if(!BR&&q.length<2)h='<div class="mu" style="padding:4px 2px">Type at least 2 letters to search.</div>';
$("res").className="list"+(BR?" big":"");$("res").innerHTML=h;
$("bb").textContent=BR?"Hide the full list":"Browse all "+GAMES.length+" games"}
function tgl(i){var n=GAMES[i],k=has(n);if(k>-1)D.g.splice(k,1);else D.g.push({n:n,s:-1,f:0});res();mine()}
function own(){var n=Q.trim().slice(0,80);if(n&&has(n)<0)D.g.push({n:n,s:-1,f:0});Q="";$("q").value="";res();mine()}
function mine(){
$("cnt").textContent=D.g.length;
$("bulk").innerHTML=D.g.length>1?'<div class="card row"><span>Set all unrated games to:</span><select style="width:150px" onchange="bulk(this.value)"><option value="">Choose…</option>'+RT.map(function(t,k){return'<option value="'+k+'">'+t+'</option>'}).join("")+'</select></div>':"";
$("mine").innerHTML=D.g.length?D.g.map(function(g,i){
return'<div class="card"><div class="row"><b>'+esc(g.n)+'</b><button class="x" onclick="del('+i+')">✕</button></div>'+
'<label>How well do you play it?</label><select onchange="D.g['+i+'].s=+this.value;mine()"><option value="-1"'+(g.s<0?" selected":"")+'>Choose…</option>'+RT.map(function(t,k){return'<option value="'+k+'"'+(g.s===k?" selected":"")+'>'+t+' · '+RD[k]+'</option>'}).join("")+'</select>'+
'<label>How do you feel about it?</label><div class="feel">'+FE.map(function(x){return'<button class="fb'+(g.f===x[0]?" on":"")+'" onclick="D.g['+i+'].f='+x[0]+';mine()"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join("")+'</div></div>'}).join(""):'<div class="mu" style="padding:4px 2px">Games you pick above will show up here.</div>'}
function del(i){D.g.splice(i,1);res();mine()}
function bulk(v){if(v==="")return;D.g.forEach(function(g){if(g.s<0)g.s=+v});mine()}
function chips(){$("chs").innerHTML=STYLE.map(function(t){return chip("pf",t)}).join("")+WHEN.map(function(t){return chip("w",t)}).join("")}
function chip(k,t){return'<button class="chip'+(D[k].indexOf(t)>-1?" on":"")+'" onclick="tg(\''+k+'\','+(k==="pf"?STYLE:WHEN).indexOf(t)+')">'+esc(t)+'</button>'}
function tg(k,i){var t=(k==="pf"?STYLE:WHEN)[i],j=D[k].indexOf(t);if(j>-1)D[k].splice(j,1);else D[k].push(t);chips()}
function build(){
var fl={"2":"❤️ Loves it","1":"👍 Likes it","-1":"👎 Not a fan","-2":"😡 Hates it"};
var m="Hi Wits & Winks! 👋 Here are my details for Game Night:\n\n*Name:* "+D.n.trim()+"\n*Phone:* "+D.p.trim()+"\n"+(D.e.trim()?"*Email:* "+D.e.trim()+"\n":"")+(D.a.trim()?"*Address:* "+D.a.trim()+"\n":"")+
(D.pf.length?"*Play style:* "+D.pf.join(", ")+"\n":"")+(D.w.length?"*When:* "+D.w.join(", ")+"\n":"")+
"\n*Games:*\n"+D.g.map(function(g){return"• "+g.n+" – "+RT[g.s]+(fl[g.f]?" · "+fl[g.f]:"")}).join("\n")+
(D.c.trim()?"\n\n*Comments:* "+D.c.trim():"");
var o={n:D.n.trim(),p:D.p.trim(),e:D.e.trim(),a:D.a.trim(),c:D.c.trim(),pf:D.pf,w:D.w,g:D.g.map(function(g){return{n:g.n,s:g.s,f:g.f}})};
return m+"\n\n(Please don’t edit the line below)\nWW1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function send(){
var e="";
if(!D.n.trim()||!D.p.trim())e="Please add your name and phone number.";
else if(D.p.replace(/\D/g,"").length<8)e="Please check your phone number.";
else if(D.e.trim()&&!/^\S+@\S+\.\S+$/.test(D.e.trim()))e="Please check your email address.";
else if(!D.g.length)e="Please pick at least one game.";
else if(D.g.some(function(g){return g.s<0}))e="Please choose how well you play each game (step 3).";
if(e){$("err").innerHTML='<div class="err">'+esc(e)+'</div>';return}
done=build();vDone()}
function vDone(){
var link="https://wa.me/"+WA+"?text="+encodeURIComponent(done);
$("app").innerHTML='<div class="card" style="text-align:center;margin-top:20px"><div style="font-size:44px">🎉</div><b style="font-size:20px">Almost done, '+esc(D.n.trim().split(" ")[0])+'!</b><p class="mu">Tap the green button to send your answers to us on WhatsApp. Just press send in the chat that opens.</p>'+
'<a class="wa" href="'+link+'" target="_blank" rel="noopener">Send on WhatsApp</a>'+
'<button class="ghost" style="width:100%;margin-top:12px" onclick="cp()">Copy my answers instead</button><div id="cm" class="mu" style="margin-top:8px"></div></div>'+
'<h2>Your answers</h2><pre>'+esc(done.replace(/\n\n\(Please[\s\S]*$/,""))+'</pre>'+
'<p class="mu">Want to add more games later? Fill the form again with the same phone number and we’ll merge it into your profile.</p><button class="ghost" style="width:100%;margin-bottom:10px" onclick="again()">+ Add more games (new response)</button><button class="ghost" style="width:100%" onclick="init()">‹ Edit my answers</button>';window.scrollTo(0,0)}
function again(){D.g=[];D.pf=[];D.w=[];D.c="";Q="";BR=false;init()}
function cp(){
function ok(){$("cm").textContent="Copied! Paste it in WhatsApp and send it to us."}
function fb(){var t=document.createElement("textarea");t.value=done;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){$("cm").textContent="Couldn’t copy. Please use the WhatsApp button."}t.remove()}
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(done).then(ok,fb);else fb()}
init();
</script>
</body>
</html>
